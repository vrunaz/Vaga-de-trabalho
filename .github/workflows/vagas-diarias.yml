name: Minhas Vagas — atualização diária
on:
  workflow_dispatch:
  schedule:
    # 11:00 UTC = 08:00 em Belém (UTC−3). O GitHub pode atrasar execuções agendadas.
    - cron: '0 11 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: minhas-vagas-pages
  cancel-in-progress: false
jobs:
  atualizar-e-publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validar regras do aplicativo
        run: npm test
      - name: Buscar vagas e preparar site
        run: npm run build:site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publicar site atualizado
        id: deployment
        uses: actions/deploy-pages@v4
